<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Carta de platos peruanos de La Candelaria, Barranco.">
    <title>Carta | La Candelaria</title>

    <!-- CSS externos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="text-danger">La</span>Candelaria</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#about">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#services">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#dances">Danzas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="menu.html">Carta</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contact">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#location">Ubicación</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Menu del restaurante -->
    <main class="menu-page container">
        <h2 class="text-center mb-4">Menú Peruano</h2>

        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                <div class="product text-center">
                    <img src="img/platos/ceviche.webp" alt="Ceviche criollo" loading="lazy">
                    <div class="product-title">Ceviche Criollo</div>
                    <div class="product-price">S/35</div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                <div class="product text-center">
                    <img src="img/platos/pachamanca.webp" alt="Pachamanca" loading="lazy">
                    <div class="product-title">Pachamanca</div>
                    <div class="product-price">S/40</div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                <div class="product text-center">
                    <img src="img/platos/chicharron.png" alt="Chicharrón de pescado" loading="lazy">
                    <div class="product-title">Chicharrón de Pescado</div>
                    <div class="product-price">S/30</div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                <div class="product text-center">
                    <img src="img/platos/tacacho.webp" alt="Tacacho" loading="lazy">
                    <div class="product-title">Tacacho</div>
                    <div class="product-price">S/24</div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                <div class="product text-center">
                    <img src="img/platos/cocona.webp" alt="Jugo de cocona" loading="lazy">
                    <div class="product-title">Jugo de Cocona</div>
                    <div class="product-price">S/20</div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                <div class="product text-center">
                    <img src="img/platos/chicha-morada.webp" alt="Vaso de chicha morada" loading="lazy">
                    <div class="product-title">Chicha Morada</div>
                    <div class="product-price">S/5</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark p-2 text-center">
        <div class="container">
            <p class="text-white mb-0">2026 © La Candelaria Perú</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

</html>
